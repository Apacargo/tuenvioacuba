<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venta de Contenedores • Apacargo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* ================== GENERAL ================== */
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #111;
    color: #fff;
}

/* ================== HEADER ================== */
header {
    background: #000;
    color: #d4af37;
    padding: 15px;
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    border-bottom: 3px solid #d4af37;
}

/* ================== GRID CARDS ================== */
.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
    padding: 20px;
}

.card {
    background: #1a1a1a;
    border: 2px solid #d4af37;
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.25s;
    cursor: pointer;
}
.card:hover {
    transform: scale(1.03);
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

/* TEXTOS DE TARJETA */
.card-info {
    padding: 15px;
}
.card-title {
    font-size: 18px;
    font-weight: 600;
    color: #d4af37;
}
.card-details {
    margin-top: 6px;
    font-size: 14px;
}
.card-price {
    margin-top: 10px;
    font-size: 18px;
    font-weight: 600;
    color: #d4af37;
}

/* BOTÓN COMPRAR */
.buy-btn {
    display: block;
    width: 100%;
    background: #d4af37;
    color: #111;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    margin-top: 12px;
    text-decoration: none;
    font-weight: 600;
}

/* ================== MODAL ================== */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 9999;
}

.modal-content {
    background: #000;
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 480px;
    border: 3px solid #d4af37;
    text-align: center;
}

.modal img {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 12px;
}

/* BOTÓN VOLVER */
#btn-volver {
    background: #d4af37;
    color: #111;
    padding: 10px;
    border-radius: 10px;
    text-decoration: none;
    display: block;
    width: 100%;
    font-weight: 600;
    margin-top: 15px;
    font-size: 18px;
}

/* BOTÓN CERRAR (X) */
.close {
    font-size: 30px;
    position: absolute;
    top: 10px;
    right: 20px;
    color: #d4af37;
    cursor: pointer;
}
.btn-volver {
  display: inline-block;
  background-color: #000;
  color: #fff; /* TEXTO BLANCO */
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  text-decoration: none;
  border: 2px solid #d4af37; /* DORADO */
  transition: 0.3s;
}
.btn-volver:hover {
  background-color: #d4af37; /* DORADO */
  color: #000; /* TEXTO NEGRO AL PASAR MOUSE */
}

/* ================== RESPONSIVE ================== */
@media (max-width: 480px) {
    .modal-content {
        padding: 15px;
    }
    .card img {
        height: 170px;
    }
}
</style>
</head>

<body>

<header>Venta de Contenedores • Apacargo</header>
<a href="index.html" class="btn-volver">⬅ Volver al Inicio</a>
<div class="container" id="contenedor-list"></div>

<!-- ===================== MODAL ===================== -->
<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <img id="modal-img">
        <h2 id="modal-title"></h2>
        <p id="modal-details"></p>
        <h3 id="modal-price"></h3>
        <a id="modal-whatsapp" class="buy-btn" target="_blank">Comprar por WhatsApp</a>
        <a id="btn-volver" onclick="closeModal()">Volver</a>
    </div>
</div>

<script>
// ===================== DATOS DE CONTENEDORES =====================
const contenedores = [
    {id:1, nombre:"Contenedor de Pollo 40ft", detalles:"Contenedor de 40 pies con 54000 libras de pollo en cajas de 40 libras. Total de cajas 1350. Prepago en el exterior", precio:"31 000 USD", img:"images/contenedor1.jpg"},
    {id:2, nombre:"Contenedor de Aceite 40ft", detalles:"Contenedor 31500 unidades (2100 cajas). Caja de 12 pomos. Contenido: 900mL.", precio:"29 360 USD", img:"images/contenedor2.jpg"},
    {id:3, nombre:"Contenedor de Harina 40ft", detalles:"Contenedor de 40 pies con 1040 sacos de 25kg de harina turka calidad premium.", precio:"22 000 USD", img:"images/contenedor3.jpg"},
    {id:4, nombre:"Contenedor de Azucar 20ft", detalles:"Azúcar Refino Contenedor de 20 PIES 25.75 Toneladas / 515 SACOS DE 50 KG.", precio:"17 200 USD", img:"images/contenedor4.jpg"},
    {id:5, nombre:"Contenedor de Manteca 20ft", detalles:"Contenedor de manteca 15 kg. Contenedor de 20 pies trae 1100 cajas de 15 Kg. Marca: los 3 chanchitos.", precio:"23 000 USD", img:"images/contenedor5.jpg"},
    {id:6, nombre:"Contenedor de Cerveza Cristal 20ft", detalles:"Contenedor con 2000 cajas ", precio:"17 640 USD", img:"images/contenedor6.jpg"},
    {id:7, nombre:"Contenedor de Leche 40ft", detalles:"Contenedor con 1000 sacos de leche (Bartex) en polvo de 25 kg cada uno.", precio:"46 500 USD", img:"images/contenedor7.jpg"},
    {id:8, nombre:"Contenedor de Yogurt 40ft", detalles:"Contenedor de 40 pies con 3762 cajas de yogurt de 12 packs de 4 unidades.Cantidad de unidades: 45 144 packs de 4 unidades (180 576 unidades de 125g cada uno).", precio:"32 600 USD", img:"images/contenedor8.jpg"},
    {id:9, nombre:"Contenedor de Arroz 40ft", detalles:"Contenedor de 40 pies con 510 sacos de 50kg.", precio:"19 380 000 USD", img:"images/contenedor9.jpg"},
    {id:10, nombre:"Contenedor de Espaguetis 40ft", detalles:"Contenedor con 2730 cajas de 20 unidades de 500gm.", precio:"15 872 USD", img:"images/contenedor10.jpg"}
];  

// ===================== RENDER =====================
const list = document.getElementById("contenedor-list");

contenedores.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
        <img loading="lazy" src="${item.img}">
        <div class="card-info">
            <div class="card-title">${item.nombre}</div>
            <div class="card-details">${item.detalles}</div>
            <div class="card-price">${item.precio}</div>
            <a class="buy-btn" href="https://wa.me/14473095580?text=Hola,%20quiero%20información%20sobre:%20${encodeURIComponent(item.nombre)}" target="_blank">Comprar</a>
        </div>
    `;
    card.onclick = () => openModal(item);
    list.appendChild(card);
});

// ===================== MODAL FUNCIONES =====================
function openModal(item) {
    document.getElementById("modal-img").src = item.img;
    document.getElementById("modal-title").textContent = item.nombre;
    document.getElementById("modal-details").textContent = item.detalles;
    document.getElementById("modal-price").textContent = item.precio;
    document.getElementById("modal-whatsapp").href =
        `https://wa.me/14473095580?text=Hola,%20quiero%20información%20sobre:%20${encodeURIComponent(item.nombre)}`;

    document.getElementById("modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
