<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Triciclos • Apacargo</title>

<style>
:root {
  --oro: #d4af37;
  --fondo: #0a0a0a;
  --card-bg: #111;
  --text: #fff;
  --accent: #b8860b;
  --shadow: rgba(212, 175, 55, 0.25);
}

body {
  font-family: "Poppins", sans-serif;
  margin: 0;
  background: var(--fondo);
  color: var(--text);
}

/* HEADER */
header {
  background: #000;
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid var(--oro);
}
header h1 {
  color: var(--oro);
  font-size: 28px;
  margin: 0;
}

/* BUSCADOR */
.search-box {
  text-align: center;
  margin: 20px auto;
}
.search-box input {
  width: 90%;
  max-width: 380px;
  padding: 12px 15px;
  border: 1px solid var(--oro);
  background: #000;
  color: var(--text);
  border-radius: 6px;
  font-size: 16px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
  padding: 20px;
}

/* CARD */
.triciclo-card {
  background: var(--card-bg);
  border: 1px solid #222;
  border-radius: 10px;
  padding: 10px;
  transition: 0.3s;
  cursor: pointer;
  box-shadow: 0 0 15px var(--shadow);
}
.triciclo-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 0 20px var(--oro);
}
.triciclo-card img {
  width: 100%;
  border-radius: 10px;
  height: 180px;
  object-fit: cover;
}
.triciclo-card h3 {
  margin: 10px 0 5px;
  color: var(--oro);
}
.triciclo-card .desc {
  font-size: 14px;
  opacity: 0.9;
}
.price {
  margin: 10px 0;
  font-weight: bold;
  color: var(--accent);
}

/* MODAL */
#modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.8);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-content {
  background: #111;
  border: 1px solid var(--oro);
  padding: 20px;
  border-radius: 10px;
  max-width: 480px;
  width: 100%;
  text-align: center;
}
.modal-content img {
  width: 100%;
  border-radius: 10px;
  margin-bottom: 15px;
}
.modal-content h2 {
  color: var(--oro);
}
.modal-content p {
  margin: 10px 0;
}
.close-btn {
  background: red;
  color: #fff;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  border: none;
  margin-top: 10px;
}
.whatsapp-btn {
  background: #25d366;
  color: #fff;
  padding: 10px 18px;
  border-radius: 8px;
  margin-top: 10px;
  display: inline-block;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>Triciclos • Colección Premium</h1>
</header>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Buscar triciclo..." onkeyup="buscar()">
</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-content">
    <img id="modalImg">
    <h2 id="modalName"></h2>
    <p id="modalDesc"></p>
    <h3 id="modalPrice" style="color:var(--accent)"></h3>

    <a id="wsLink" class="whatsapp-btn" target="_blank">Contactar por WhatsApp</a>
    <button class="close-btn" onclick="closeModal()">Cerrar</button>
  </div>
</div>

<script>
/* ================================
   DATOS DE LOS 15 TRICICLOS
=================================*/
const triciclos = [
{id:1, nombre:"DAYANG BEIYI T5", detalles:"Motor 250cc, refrigeración por agua. Carga hasta 2000 kg. Velocidad máxima 65km/h.", precio:"3500 USD", img:"images/triciclo1.jpg"},
{id:2, nombre:"Motorizado 200cc Triciclo de Carga Motocicleta", detalles:"200cc refrigeración por agua. Semi cabina, freno hidráulico, 3 ruedas reforzadas.", precio:"3000 USD", img:"images/triciclo2.jpg"},
{id:3, nombre:"Triciclo de motor de camión DY-P2", detalles:"Motor 250cc, caja de carga 2.4x1.5m, freno hidráulico, cabina cerrada completa.", precio:"3800 USD", img:"images/triciclo3.jpg"},
{id:4, nombre:"Triciclo 150CC", detalles:"Motor 150cc 4 tiempos. Carga máxima 500kg. Freno delantero y trasero de tambor.", precio:"2900 USD", img:"images/triciclo4.jpg"},
{id:5, nombre:"Triciclo de cabina cerrada para carga", detalles:"Motor 250cc enfriado hidráulicamente. Carga hasta 2000 kg. Freno de tambor.", precio:"3800 USD", img:"images/triciclo5.jpg"},
{id:6, nombre:"TRICICLO ELECTRICO 3 RUEDAS MISHOZUKI", detalles:"Motor 1200w 72v. Carga 500kg. Autonomía 80km. Batería plomo-ácido 72v 60Ah.", precio:"2400 USD", img:"images/triciclo6.jpg"},
{id:7, nombre:"ONEBOT Triciclo eléctrico T414 (X1)", detalles:"Motor 1000W, 72V. Velocidad máx. 40km/h. Carga 300kg. Freno de disco.", precio:"2300 USD", img:"images/triciclo7.jpg"},
{id:8, nombre:"Triciclo eléctrico de ONEBOT MS172A", detalles:"Motor 1200W, 72V. Rango 113km. Carga 400kg. Suspensión avanzada y freno hidráulico.", precio:"2500 USD", img:"images/triciclo8.jpg"},
{id:9, nombre:"Triciclo Changli", detalles:"Motor 1000W 60V. Velocidad 30–50km/h. Carga 500kg. Peso neto 317kg.", precio:"2600 USD", img:"images/triciclo9.jpg"},
{id:10, nombre:"Triciclo Changli", detalles:"Motor:1000W. Batería:Raly 2 LT PO4 de 72V 60AH. Autonomía: 120-130 Km por carga. Carga máxima 400kg. Velocidad máxima 30-50km/h.", precio:"2800 USD", img:"images/triciclo10.jpg"},
{id:11, nombre:"Triciclo Raly", detalles:"Motor:1500W. Batería: 72V 55AH. Autonomía: 100-120 Km por carga. Carga máxima 400kg. Velocidad máxima 30-50km/h.", precio:"2400 USD", img:"images/triciclo11.jpg"},
{id:12, nombre:"Triciclo Vedca", detalles:"Motor 1000W 50V. Velocidad 30–35km/h. Carga 470kg. Peso neto 225kg.", precio:"2000 USD", img:"images/triciclo12.jpg"},
{id:13, nombre:"Triciclo Jinli", detalles:"Motor 1300W 60AH. Velocidad 30–50km/h. Carga 500kg. Peso neto 300kg.", precio:"2770 USD", img:"images/triciclo13.jpg"},
{id:14, nombre:"Triciclo One Bot", detalles:"Motor:1500W. Batería:Lithium de 72V 45AH. Autonomía: 120 Km por carga. Tiempo de Carga 8-10h. Carga máxima 1000kg. Velocidad máxima 50km/h.", precio:"1800 USD", img:"images/triciclo14.jpg"},
{id:15, nombre:"Triciclo Raly", detalles:"Motor:1500W. Batería:Raly 2 LT PO4 de 72V. Autonomía: 120-130 Km por carga. Tiempo de Carga 8-10h. Carga máxima 1000kg. Velocidad máxima 50km/h.", precio:"2400 USD", img:"images/triciclo15.jpg"},
];

/* ================================
   GENERAR GRID CON LAZY-LOAD
=================================*/
const grid = document.getElementById("grid");

triciclos.forEach(t => {
  const card = document.createElement("div");
  card.className = "triciclo-card";
  card.onclick = () => openModal(t);

  card.innerHTML = `
    <img loading="lazy" src="${t.img}" alt="${t.nombre}">
    <h3>${t.nombre}</h3>
    <p class="desc">${t.detalles}</p>
    <div class="price">${t.precio}</div>
  `;
  grid.appendChild(card);
});

/* ================================
   BUSCADOR
=================================*/
function buscar() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  document.querySelectorAll(".triciclo-card").forEach(card => {
    card.style.display = card.innerText.toLowerCase().includes(q) ? "block" : "none";
  });
}

/* ================================
   MODAL
=================================*/
function openModal(t) {
  document.getElementById("modalImg").src = t.img;
  document.getElementById("modalName").innerText = t.nombre;
  document.getElementById("modalDesc").innerText = t.detalles;
  document.getElementById("modalPrice").innerText = t.precio;

  document.getElementById("wsLink").href =
    "https://wa.me/5350896082?text=Hola, estoy interesado en el triciclo *" +
    encodeURIComponent(t.nombre) + "* (" + t.precio + ")";

  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
